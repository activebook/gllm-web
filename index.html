<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GLLM Web Client</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <header class="glass-header">
        <div class="header-content">
          <h1>GLLM Studio</h1>
          <div class="status-indicator">
            <span class="dot"></span>
            <span id="connection-status">Ready</span>
          </div>
        </div>
      </header>
      
      <main id="chat-container">
        <!-- Messages will be injected here -->
        <div class="message system startup-message">
          <div class="content">Connected to GLLM SSE Web Client. Start typing to interact.</div>
        </div>
      </main>

      <footer class="glass-footer">
        <div class="input-container">
          <div id="tool-status-toast" class="tool-toast hidden">
            <div class="spinner"></div>
            <span id="tool-status-text">Using tool...</span>
          </div>
          <form id="chat-form">
            <textarea id="prompt-input" rows="1" placeholder="Send a message or /command..."></textarea>
            <button type="submit" id="send-btn" title="Send (Enter)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
          </form>
        </div>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
